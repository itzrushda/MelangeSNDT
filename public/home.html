<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Melange '26 — Portal Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Great+Vibes&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%; height: 100dvh;
      background: #090d16;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: #fff;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 20px) env(safe-area-inset-right, 20px) env(safe-area-inset-bottom, 20px) env(safe-area-inset-left, 20px);
      position: relative;
    }

    /* Ambient blobs */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 { width: 320px; height: 320px; background: rgba(99,102,241,0.18); top: -60px; left: -80px; }
    .blob-2 { width: 260px; height: 260px; background: rgba(168,85,247,0.14); bottom: 60px; right: -60px; }
    .blob-3 { width: 180px; height: 180px; background: rgba(245,158,11,0.10); top: 50%; left: 50%; transform: translate(-50%,-50%); }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* Logo */
    .logo-area {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeUp 0.6s ease both;
    }

    .melange-word {
      font-family: 'Great Vibes', cursive;
      font-size: 3.4rem;
      background: linear-gradient(135deg, #f59e0b 0%, #fcd34d 50%, #d97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      display: block;
    }

    .year-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 100px;
      padding: 4px 14px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #94a3b8;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .year-badge .dot {
      width: 6px; height: 6px;
      background: #f59e0b;
      border-radius: 50%;
      animation: pulse-dot 2s infinite;
    }

    .tagline {
      font-size: 0.82rem;
      color: #64748b;
      margin-top: 10px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    /* Portal cards */
    .portals-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 16px;
      text-align: center;
      animation: fadeUp 0.6s 0.1s ease both;
    }

    .portal-card {
      width: 100%;
      background: rgba(18, 26, 43, 0.85);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 20px;
      padding: 22px 20px;
      display: flex;
      align-items: center;
      gap: 18px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: all 0.22s ease;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .portal-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 20px;
      opacity: 0;
      transition: opacity 0.22s ease;
    }

    .portal-card.gs::before { background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(168,85,247,0.08)); }
    .portal-card.admin::before { background: linear-gradient(135deg, rgba(245,158,11,0.15), rgba(217,119,6,0.08)); }

    .portal-card:hover::before,
    .portal-card:active::before { opacity: 1; }

    .portal-card:active { transform: scale(0.98); }

    .portal-card.gs { animation: fadeUp 0.6s 0.2s ease both; }
    .portal-card.admin { animation: fadeUp 0.6s 0.3s ease both; }

    .card-icon-wrap {
      width: 54px; height: 54px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .gs .card-icon-wrap {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      box-shadow: 0 8px 20px rgba(99,102,241,0.35);
    }

    .admin .card-icon-wrap {
      background: linear-gradient(135deg, #d97706, #f59e0b);
      box-shadow: 0 8px 20px rgba(245,158,11,0.35);
    }

    .card-text { flex: 1; }

    .card-title {
      font-size: 1.08rem;
      font-weight: 800;
      color: #f1f5f9;
      margin-bottom: 4px;
    }

    .card-desc {
      font-size: 0.78rem;
      color: #64748b;
      font-weight: 500;
      line-height: 1.4;
    }

    .card-arrow {
      font-size: 1rem;
      color: #334155;
      flex-shrink: 0;
    }

    .gs:hover .card-arrow, .gs:active .card-arrow { color: #6366f1; }
    .admin:hover .card-arrow, .admin:active .card-arrow { color: #f59e0b; }

    /* Divider */
    .divider {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      animation: fadeUp 0.6s 0.25s ease both;
    }
    .divider-line { flex: 1; height: 1px; background: rgba(255,255,255,0.07); }
    .divider-text { font-size: 0.7rem; color: #334155; font-weight: 600; white-space: nowrap; }

    /* Footer */
    .footer-note {
      margin-top: 28px;
      font-size: 0.72rem;
      color: #334155;
      text-align: center;
      animation: fadeUp 0.6s 0.4s ease both;
    }

    .footer-note span {
      color: #6366f1;
      font-weight: 700;
    }

    /* Gallery link */
    .gallery-link {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #475569;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s;
    }
    .gallery-link:hover { color: #94a3b8; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.7); }
    }
  </style>
</head>
<body>

  <!-- Ambient background blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="wrapper">

    <!-- Logo -->
    <div class="logo-area">
      <span class="melange-word">Melange</span>
      <div style="display:flex; justify-content:center; margin-top:8px;">
        <div class="year-badge">
          <div class="dot"></div>
          Inter-Collegiate Fest &nbsp;·&nbsp; 2026
        </div>
      </div>
      <p class="tagline">Select your portal to continue</p>
    </div>

    <!-- Portal cards -->
    <p class="portals-label">Choose Portal</p>

    <a href="gs-portal.html" class="portal-card gs">
      <div class="card-icon-wrap">
        <i class="fa-solid fa-id-badge"></i>
      </div>
      <div class="card-text">
        <div class="card-title">GS Portal</div>
        <div class="card-desc">Add &amp; manage your college's student contingent</div>
      </div>
      <i class="fa-solid fa-chevron-right card-arrow"></i>
    </a>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">OR</div>
      <div class="divider-line"></div>
    </div>

    <a href="admin-portal.html" class="portal-card admin">
      <div class="card-icon-wrap">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <div class="card-text">
        <div class="card-title">Admin Portal</div>
        <div class="card-desc">Approve students, manage events &amp; oversee fest</div>
      </div>
      <i class="fa-solid fa-chevron-right card-arrow"></i>
    </a>

    <!-- Gallery link -->
    <a href="public/gallery.html" class="gallery-link">
      <i class="fa-solid fa-mobile-screen"></i>
      View Mobile UI Gallery
    </a>

    <p class="footer-note">
      Powered by <span>Melange Central Directorate</span>
    </p>

  </div>

</body>
</html>
